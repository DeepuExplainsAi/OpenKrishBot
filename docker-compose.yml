services:
  openkrishbot:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]   # put a TLS proxy in front before exposing it
    environment:
      APP_URL: http://localhost:8787   # the public URL if you proxy it
      SERVER_URL: http://localhost:8787
      # SCRIPT_REMOTE: "1"   # allow /script calls from other machines (token still required)
    volumes: ["openkrishbot-data:/data"]
volumes:
  openkrishbot-data:
