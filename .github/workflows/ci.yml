name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openkrishbot .
      - name: starts and answers /api/health
        run: |
          docker run -d --name okb -p 8787:8787 openkrishbot
          for i in $(seq 1 30); do curl -fs localhost:8787/api/health && exit 0; sleep 2; done
          docker logs okb; exit 1
